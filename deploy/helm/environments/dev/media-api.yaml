fullnameOverride: media-api

image:
  repository: 682405977339.dkr.ecr.ap-northeast-2.amazonaws.com/donmoa-dev-media-api
  tag: latest

serviceAccount:
  annotations:
    # Replace with the real IRSA role before deploy.
    eks.amazonaws.com/role-arn: arn:aws:iam::682405977339:role/donmoa-dev-media-s3-role

service:
  port: 8094

container:
  port: 8094

env:
  SERVER_PORT: "8094"
  SPRING_PROFILES_ACTIVE: develop
  DB_URL: jdbc:postgresql://donmoa-dev-aurora.cluster-cfw84sg260sa.ap-northeast-2.rds.amazonaws.com:5432/media_db
  DB_USERNAME: postgres
  REDIS_HOST: donmoa-dev-redis.awmnbx.ng.0001.apn2.cache.amazonaws.com
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: 10.30.130.193:9092
  MEDIA_S3_REGION: ap-northeast-2
  MEDIA_S3_BUCKET: team2-donmoa-media-raw
  MEDIA_S3_KEY_PREFIX: team2-donmoa-media
  MEDIA_S3_PRESIGNED_PUT_TTL_SECONDS: "300"
  APP_GATEWAY_SECURITY_ENABLED: "true"
  APP_GATEWAY_SECURITY_GATEWAY_AUTH_ENABLED: "true"
  APP_GATEWAY_SECURITY_INTERNAL_AUTH_HEADER: X-Gateway-Auth
  APP_GATEWAY_SECURITY_USER_ID_HEADER: X-User-Id
  APP_SECURITY_CONTEXT_MAX_AGE_MILLIS: "300000"

secretEnv:
  DB_PASSWORD:
    remoteRef: donmoa/dev/media-db
    property: password
  APP_SECURITY_CONTEXT_SIGNING_KEY:
    remoteRef: donmoa/dev/common
    property: APP_SECURITY_CONTEXT_SIGNING_KEY
  APP_GATEWAY_SECURITY_INTERNAL_AUTH_TOKEN:
    remoteRef: donmoa/dev/common
    property: APP_GATEWAY_SECURITY_INTERNAL_AUTH_TOKEN
