fullnameOverride: notification-service

image:
  repository: 682405977339.dkr.ecr.ap-northeast-2.amazonaws.com/donmoa-dev-notification-service
  tag: latest

service:
  port: 8092

container:
  port: 8092

env:
  SERVER_PORT: "8092"
  SPRING_PROFILES_ACTIVE: develop
  MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
  DB_URL: jdbc:postgresql://donmoa-dev-aurora.cluster-cfw84sg260sa.ap-northeast-2.rds.amazonaws.com:5432/notification_db
  DB_USERNAME: postgres
  REDIS_HOST: donmoa-dev-redis.awmnbx.ng.0001.apn2.cache.amazonaws.com
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: 10.30.130.193:9092
  MAIL_HOST: smtp.gmail.com
  MAIL_PORT: "587"
  MAIL_SMTP_AUTH: "true"
  MAIL_SMTP_CONNECTION_TIMEOUT_MS: "5000"
  MAIL_SMTP_STARTTLS: "true"
  MAIL_SMTP_TIMEOUT_MS: "5000"
  MAIL_SMTP_WRITE_TIMEOUT_MS: "5000"
  NOTIFICATION_EMAIL_PROVIDER: smtp
  NOTIFICATION_EMAIL_FALLBACK_ENABLED: "false"
  NOTIFICATION_SES_REGION: ap-northeast-2
  USER_SERVICE_URL: http://profile-service:8071
  PRODUCT_SERVICE_URL: http://product-service:8084
  APP_GATEWAY_SECURITY_ENABLED: "true"
  APP_GATEWAY_SECURITY_GATEWAY_AUTH_ENABLED: "true"
  APP_GATEWAY_SECURITY_INTERNAL_AUTH_HEADER: X-Gateway-Auth
  APP_GATEWAY_SECURITY_USER_ID_HEADER: X-User-Id
  APP_SECURITY_CONTEXT_MAX_AGE_MILLIS: "300000"

secretEnv:
  DB_PASSWORD:
    remoteRef: donmoa/dev/notification-db
    property: password
  APP_SECURITY_CONTEXT_SIGNING_KEY:
    remoteRef: donmoa/dev/common
    property: APP_SECURITY_CONTEXT_SIGNING_KEY
  APP_GATEWAY_SECURITY_INTERNAL_AUTH_TOKEN:
    remoteRef: donmoa/dev/common
    property: APP_GATEWAY_SECURITY_INTERNAL_AUTH_TOKEN
  MAIL_USERNAME:
    remoteRef: donmoa/dev/notification-mail
    property: MAIL_USERNAME
  MAIL_PASSWORD:
    remoteRef: donmoa/dev/notification-mail
    property: MAIL_PASSWORD
  NOTIFICATION_EMAIL_FROM:
    remoteRef: donmoa/dev/notification-mail
    property: NOTIFICATION_EMAIL_FROM

serviceMonitor:
  enabled: true
  additionalLabels:
    prometheus: donmoa
