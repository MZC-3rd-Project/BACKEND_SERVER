fullnameOverride: search-service

serviceAccount:
  create: true
  name: search-service
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::682405977339:role/donmoa-dev-eks-search-service-role

image:
  repository: 682405977339.dkr.ecr.ap-northeast-2.amazonaws.com/donmoa-dev-search-service
  tag: latest

service:
  port: 8088

container:
  port: 8088

env:
  SERVER_PORT: "8088"
  SPRING_PROFILES_ACTIVE: develop
  DB_URL: jdbc:postgresql://donmoa-dev-aurora.cluster-cfw84sg260sa.ap-northeast-2.rds.amazonaws.com:5432/search_db
  DB_USERNAME: postgres
  JPA_DDL_AUTO: "update"
  KAFKA_BOOTSTRAP_SERVERS: 10.30.130.193:9092
  PRODUCT_SERVICE_URL: http://product-service:8084
  FUNDING_SERVICE_URL: http://funding-service:8086
  STORE_SERVICE_URL: http://store-service:8072
  STOCK_SERVICE_URL: http://stock-service:8085
  ELASTICSEARCH_URIS: http://10.30.140.176:9200
  SEARCH_AI_ENRICHMENT_ENABLED: "true"
  SEARCH_AI_ENRICHMENT_AWS_REGION: ap-northeast-2
  APP_GATEWAY_SECURITY_ENABLED: "true"
  APP_GATEWAY_SECURITY_GATEWAY_AUTH_ENABLED: "true"
  APP_GATEWAY_SECURITY_INTERNAL_AUTH_HEADER: X-Gateway-Auth
  APP_GATEWAY_SECURITY_USER_ID_HEADER: X-User-Id
  APP_SECURITY_CONTEXT_MAX_AGE_MILLIS: "300000"

secretEnv:
  DB_PASSWORD:
    remoteRef: donmoa/dev/search-db
    property: password
  APP_SECURITY_CONTEXT_SIGNING_KEY:
    remoteRef: donmoa/dev/common
    property: APP_SECURITY_CONTEXT_SIGNING_KEY
  APP_GATEWAY_SECURITY_INTERNAL_AUTH_TOKEN:
    remoteRef: donmoa/dev/common
    property: APP_GATEWAY_SECURITY_INTERNAL_AUTH_TOKEN
  SEARCH_AI_ENRICHMENT_QUEUE_URL:
    remoteRef: donmoa/dev/search-ai-enrichment
    property: queue_url
