fullnameOverride: edge-nginx

replicaCount: 2

image:
  repository: nginxinc/nginx-unprivileged
  tag: 1.27-alpine

externalSecret:
  enabled: false

service:
  port: 8080

container:
  port: 8080
  extraVolumeMounts:
    - name: file-cm-nginx-conf
      mountPath: /etc/nginx/conf.d/default.conf
      subPath: default.conf

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/group.name: donmoa-dev-edge-nginx
    alb.ingress.kubernetes.io/healthcheck-path: /nginx-health
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/success-codes: 200-399
    alb.ingress.kubernetes.io/target-type: ip
  hosts:
    - host: "edge.dev.example.com"
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1
    memory: 512Mi

probes:
  liveness:
    enabled: true
    path: /nginx-health
    port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    enabled: true
    path: /nginx-health
    port: http
    initialDelaySeconds: 3
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podSecurityContext:
  fsGroup: 101

securityContext:
  runAsUser: 101
  runAsGroup: 101
  runAsNonRoot: true
  allowPrivilegeEscalation: false

fileConfigMaps:
  - name: nginx-conf
    files:
      default.conf:
        content: |
          log_format edge_json escape=json
            '{'
              '"timestamp":"$time_iso8601",'
              '"service.name":"edge-nginx",'
              '"log.type":"nginx_access",'
              '"request_id":"$request_id",'
              '"trace_id":"$http_x_b3_traceid",'
              '"method":"$request_method",'
              '"scheme":"$scheme",'
              '"host":"$host",'
              '"uri":"$uri",'
              '"query_string":"$args",'
              '"status":$status,'
              '"request_time":$request_time,'
              '"upstream_connect_time":"$upstream_connect_time",'
              '"upstream_header_time":"$upstream_header_time",'
              '"upstream_response_time":"$upstream_response_time",'
              '"upstream_addr":"$upstream_addr",'
              '"upstream_status":"$upstream_status",'
              '"remote_addr":"$remote_addr",'
              '"x_forwarded_for":"$http_x_forwarded_for",'
              '"referer":"$http_referer",'
              '"user_agent":"$http_user_agent",'
              '"bytes_sent":$bytes_sent,'
              '"body_bytes_sent":$body_bytes_sent,'
              '"request_length":$request_length,'
              '"gzip_ratio":"$gzip_ratio",'
              '"connection":$connection,'
              '"connection_requests":$connection_requests'
            '}';

          upstream gateway_backend {
              server client-gateway:8080;
              keepalive 128;
          }

          server {
              listen 8080;
              server_name _;
              access_log /dev/stdout edge_json;
              error_log /dev/stderr warn;
              gzip on;
              gzip_vary on;
              gzip_proxied any;
              gzip_comp_level 5;
              gzip_min_length 1024;
              gzip_types
                  text/plain
                  text/css
                  text/xml
                  application/json
                  application/javascript
                  application/xml
                  image/svg+xml;

              location = /nginx-health {
                  access_log off;
                  add_header Content-Type text/plain;
                  return 200 'ok';
              }

              location = /nginx_status {
                  access_log off;
                  stub_status;
                  allow 127.0.0.1;
                  allow 10.0.0.0/8;
                  deny all;
              }

              location / {
                  proxy_http_version 1.1;
                  proxy_set_header Connection "";
                  proxy_set_header Host $host;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_set_header X-Request-Id $request_id;
                  proxy_set_header X-B3-TraceId $http_x_b3_traceid;
                  proxy_connect_timeout 3s;
                  proxy_send_timeout 30s;
                  proxy_read_timeout 30s;
                  proxy_next_upstream error timeout http_502 http_503 http_504;
                  proxy_pass http://gateway_backend;
              }
          }
