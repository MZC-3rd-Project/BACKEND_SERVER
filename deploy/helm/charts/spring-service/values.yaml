nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: ""
  tag: "latest"
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

env: {}
extraEnv: []
fileConfigMaps: []

secretEnv: {}
externalSecret:
  enabled: true
  refreshInterval: 1h
  creationPolicy: Owner
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager

service:
  type: ClusterIP
  port: 8080

container:
  port: 8080
  extraPorts: []
  command: []
  args: []
  extraVolumeMounts: []

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 1
    memory: 2Gi

probes:
  liveness:
    enabled: true
    path: /actuator/health
    port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  readiness:
    enabled: true
    path: /actuator/health
    port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}
extraVolumes: []
