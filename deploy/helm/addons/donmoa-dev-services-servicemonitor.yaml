apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: donmoa-dev-services
  namespace: donmoa-system
  labels:
    prometheus: donmoa
spec:
  jobLabel: app.kubernetes.io/instance
  namespaceSelector:
    matchNames:
      - donmoa-dev
  selector:
    matchLabels:
      observability.donmoa.io/metrics-target: active
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
      scheme: http
      honorLabels: false
