<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#F7F7FB"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font: 700 46px 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #0F172A; }
      .subtitle { font: 400 20px 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #475569; }
      .section { font: 700 24px 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #0F172A; }
      .body { font: 500 24px 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #1E293B; }
      .small { font: 500 18px 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #475569; }
      .label { font: 700 14px 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; letter-spacing: 0.12em; fill: #2563EB; }
      .note { font: 600 18px 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #7C2D12; }
      .mono { font: 600 22px 'SFMono-Regular', 'Menlo', 'Consolas', monospace; fill: #0F172A; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="32" fill="url(#bg)"/>
  <circle cx="1360" cy="120" r="190" fill="#DBEAFE" opacity="0.55"/>
  <circle cx="1490" cy="250" r="90" fill="#E0F2FE" opacity="0.8"/>
  <circle cx="150" cy="760" r="160" fill="#EEF2FF" opacity="0.9"/>

  <rect x="60" y="56" width="1480" height="788" rx="28" fill="#FFFFFF" filter="url(#shadow)"/>

  <text x="110" y="126" class="label">SYNC FACADE</text>
  <text x="110" y="186" class="title">Facade로 감싼 동기 통신 구조</text>
  <text x="110" y="226" class="subtitle">서비스 로직에서는 HTTP 호출이 아니라 함수 호출처럼 보이도록 추상화해서 DX를 개선한 구조</text>

  <rect x="100" y="278" width="620" height="360" rx="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  <text x="140" y="332" class="section">핵심 설계 원칙</text>

  <circle cx="148" cy="392" r="16" fill="url(#accent)"/>
  <text x="143" y="399" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">1</text>
  <text x="182" y="400" class="body">서비스는 <tspan font-weight="700">Facade interface</tspan>만 주입받습니다.</text>

  <circle cx="148" cy="482" r="16" fill="url(#accent)"/>
  <text x="143" y="489" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">2</text>
  <text x="182" y="490" class="body">실제 HTTP 호출과 응답 파싱은 <tspan font-weight="700">DefaultFacade</tspan>가 담당합니다.</text>

  <circle cx="148" cy="572" r="16" fill="url(#accent)"/>
  <text x="143" y="579" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">3</text>
  <text x="182" y="580" class="body">그래서 서비스 코드가 함수 호출처럼 읽혀서 DX가 좋아집니다.</text>

  <rect x="770" y="278" width="730" height="360" rx="24" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="2"/>
  <text x="810" y="332" class="section">구조</text>

  <rect x="810" y="406" width="180" height="72" rx="18" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="2"/>
  <text x="848" y="450" class="body">서비스 로직</text>

  <rect x="1060" y="406" width="180" height="72" rx="18" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="2"/>
  <text x="1086" y="438" class="body">Facade</text>
  <text x="1088" y="464" class="small">function call</text>

  <rect x="1310" y="406" width="180" height="72" rx="18" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="2"/>
  <text x="1330" y="438" class="body">DefaultFacade</text>
  <text x="1357" y="464" class="small">HTTP details</text>

  <rect x="1185" y="548" width="180" height="72" rx="18" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="2"/>
  <text x="1221" y="592" class="body">Downstream</text>

  <path d="M990 442H1060" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/>
  <path d="M1240 442H1310" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/>
  <path d="M1400 478V512H1275V548" stroke="#2563EB" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="100" y="684" width="1400" height="140" rx="20" fill="#FFF7ED" stroke="#FED7AA" stroke-width="2"/>
  <text x="134" y="726" class="note">왜 중요한가</text>
  <text x="290" y="718" class="body">동기 호출은 즉시 결과를 알아야 하는 핵심 흐름에서 자주 쓰이는데,</text>
  <text x="290" y="758" class="body">서비스 코드가 HTTP 상세 구현까지 알게 되면 금방 복잡해집니다. 그래서 Facade로 감싸서 서비스에서는 함수 호출처럼 보이게 만들었습니다.</text>
  <text x="134" y="804" class="small">발표 멘트: 서비스는 findItem(), createOrder() 같은 함수만 호출하고, 실제 WebClient 호출과 예외 처리는 facade 구현체가 맡도록 분리했습니다.</text>
</svg>
