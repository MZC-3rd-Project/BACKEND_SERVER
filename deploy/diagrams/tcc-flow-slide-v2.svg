<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#F6F7FB"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F97316"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EF4444"/>
      <stop offset="1" stop-color="#DC2626"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font: 700 48px 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #0F172A; }
      .subtitle { font: 400 20px 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #475569; }
      .section { font: 700 24px 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #0F172A; }
      .body { font: 600 23px 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #1E293B; }
      .small { font: 500 18px 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #475569; }
      .tiny { font: 500 16px 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #64748B; }
      .label { font: 700 14px 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; letter-spacing: 0.12em; fill: #2563EB; }
      .note { font: 700 18px 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #7C2D12; }
      .mono { font: 600 18px 'SFMono-Regular', 'Menlo', 'Consolas', monospace; fill: #0F172A; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="32" fill="url(#bg)"/>
  <circle cx="1400" cy="120" r="180" fill="#DBEAFE" opacity="0.60"/>
  <circle cx="1490" cy="270" r="90" fill="#E0F2FE" opacity="0.85"/>
  <circle cx="180" cy="780" r="150" fill="#EEF2FF" opacity="0.95"/>

  <rect x="56" y="52" width="1488" height="796" rx="30" fill="#FFFFFF" filter="url(#shadow)"/>

  <text x="108" y="122" class="label">TCC PATTERN</text>
  <text x="108" y="184" class="title">재고 보호를 위한 TCC 흐름</text>
  <text x="108" y="224" class="subtitle">재고가 필요한 구매는 먼저 예약하고, 결제 결과에 따라 확정하거나 복구하는 구조</text>

  <rect x="96" y="270" width="360" height="148" rx="24" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="2"/>
  <text x="126" y="316" class="section">적용 기준</text>
  <rect x="126" y="336" width="140" height="38" rx="12" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="1.5"/>
  <text x="148" y="361" class="tiny">QUANTITY_BASED</text>
  <rect x="282" y="336" width="130" height="38" rx="12" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="1.5"/>
  <text x="310" y="361" class="tiny">TCC 적용</text>
  <text x="126" y="396" class="small">재고가 필요한 구매 흐름에서만 사용하고,</text>
  <text x="126" y="424" class="small">서비스 간 최종 상태 전파는 Saga로 분리했습니다.</text>

  <rect x="480" y="258" width="1024" height="404" rx="28" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  <text x="516" y="308" class="section">핵심 흐름</text>

  <rect x="526" y="408" width="148" height="88" rx="22" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="563" y="444" class="body">상품 검증</text>
  <text x="559" y="474" class="tiny">item / price / 수량 확인</text>

  <rect x="726" y="408" width="148" height="88" rx="22" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="756" y="444" class="body">orderId 생성</text>
  <text x="771" y="474" class="tiny">추적 키 확보</text>

  <rect x="926" y="394" width="188" height="116" rx="24" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2.5"/>
  <text x="996" y="430" class="body">Try</text>
  <text x="955" y="462" class="small">reserveOrderStock()</text>
  <text x="960" y="490" class="tiny">available → reserved</text>

  <rect x="1166" y="408" width="168" height="88" rx="22" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="1214" y="444" class="body">주문 저장</text>
  <text x="1187" y="474" class="tiny">session / draft / outbox</text>

  <rect x="1386" y="408" width="98" height="88" rx="22" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="1408" y="456" class="body">결제</text>

  <path d="M674 452H726" stroke="url(#blue)" stroke-width="6" stroke-linecap="round"/>
  <path d="M874 452H926" stroke="url(#blue)" stroke-width="6" stroke-linecap="round"/>
  <path d="M1114 452H1166" stroke="url(#blue)" stroke-width="6" stroke-linecap="round"/>
  <path d="M1334 452H1386" stroke="url(#blue)" stroke-width="6" stroke-linecap="round"/>

  <rect x="984" y="562" width="210" height="98" rx="24" fill="#ECFDF5" stroke="#86EFAC" stroke-width="2.5"/>
  <text x="1056" y="598" class="body">Confirm</text>
  <text x="1013" y="628" class="tiny">PAYMENT_COMPLETED</text>
  <text x="1038" y="650" class="tiny">reserved → sold</text>

  <rect x="1246" y="548" width="258" height="126" rx="24" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="2.5"/>
  <text x="1333" y="586" class="body">Cancel / Expire</text>
  <text x="1276" y="616" class="tiny">FAILED / CANCELLED / TIMED_OUT</text>
  <text x="1333" y="640" class="tiny">또는 TTL 만료</text>
  <text x="1317" y="664" class="tiny">reserved → available</text>

  <path d="M1436 496V524H1089V562" stroke="url(#green)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1436 496V524H1375V548" stroke="url(#red)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="96" y="708" width="700" height="118" rx="24" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="2"/>
  <text x="126" y="750" class="section">왜 필요한가</text>
  <text x="126" y="784" class="small">결제 전에도 재고를 먼저 보호해야 초과 판매를 줄일 수 있습니다.</text>
  <text x="126" y="812" class="small">즉시 잠가야 하지만 아직 확정할 수 없는 자원에 TCC를 적용했습니다.</text>

  <rect x="828" y="708" width="676" height="118" rx="24" fill="#FFF7ED" stroke="#FED7AA" stroke-width="2"/>
  <text x="858" y="750" class="section">Trade-off</text>
  <text x="858" y="784" class="small">초과 판매는 줄일 수 있지만, reserved 상태와 TTL, 복구 로직을 직접 관리해야 합니다.</text>
  <text x="858" y="812" class="small">즉 TCC는 안정성을 얻는 대신 상태 관리 복잡도를 감수하는 패턴입니다.</text>
</svg>
