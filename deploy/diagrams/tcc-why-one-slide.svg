<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#F6F7FB"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F97316"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EF4444"/>
      <stop offset="1" stop-color="#DC2626"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font: 700 48px 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #0F172A; }
      .subtitle { font: 400 20px 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #475569; }
      .label { font: 700 14px 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; letter-spacing: 0.12em; fill: #2563EB; }
      .section { font: 700 25px 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #0F172A; }
      .body { font: 600 24px 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #1E293B; }
      .small { font: 500 18px 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #475569; }
      .tiny { font: 600 15px 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #64748B; }
      .badge { font: 700 14px 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #FFFFFF; letter-spacing: 0.04em; }
      .callout { font: 700 22px 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #0F172A; }
      .cardTitle { font: 700 22px 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #0F172A; }
      .cardBody { font: 500 17px 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #475569; }
      .mono { font: 700 17px 'SFMono-Regular', 'Menlo', 'Consolas', monospace; fill: #0F172A; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="32" fill="url(#bg)"/>
  <circle cx="1460" cy="110" r="190" fill="#DBEAFE" opacity="0.55"/>
  <circle cx="1500" cy="760" r="120" fill="#E0F2FE" opacity="0.55"/>
  <circle cx="120" cy="760" r="130" fill="#EEF2FF" opacity="0.95"/>

  <rect x="48" y="44" width="1504" height="812" rx="32" fill="#FFFFFF" filter="url(#shadow)"/>

  <text x="96" y="108" class="label">WHY TCC FOR STOCK</text>
  <text x="96" y="168" class="title">재고는 결제 전에 먼저 보호되어야 했습니다</text>
  <text x="96" y="206" class="subtitle">오버세일 리스크는 주문 시점과 결제 확정 시점 사이의 시간차에서 발생했고, 그래서 available을 먼저 reserved로 바꾸는 구조가 필요했습니다.</text>

  <rect x="96" y="248" width="638" height="364" rx="28" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="124" y="276" width="162" height="34" rx="17" fill="url(#red)"/>
  <text x="150" y="299" class="badge">1. 문제: 빈 시간차</text>
  <text x="124" y="344" class="section">결제 대기 구간이 열려 있는 동안</text>
  <text x="124" y="378" class="small">같은 재고가 여러 주문에 동시에 열려 있었습니다.</text>

  <line x1="168" y1="446" x2="620" y2="446" stroke="#CBD5E1" stroke-width="6" stroke-linecap="round"/>
  <circle cx="184" cy="446" r="10" fill="#2563EB"/>
  <circle cx="620" cy="446" r="10" fill="#16A34A"/>
  <rect x="270" y="416" width="220" height="60" rx="30" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="2"/>
  <text x="335" y="453" class="body" fill="#991B1B">결제 대기 구간</text>
  <text x="144" y="490" class="tiny">구매 요청</text>
  <text x="574" y="490" class="tiny">결제 확정</text>

  <rect x="144" y="536" width="164" height="48" rx="16" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="178" y="566" class="small">User A 주문 진입</text>
  <rect x="522" y="536" width="164" height="48" rx="16" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="556" y="566" class="small">User B 주문 진입</text>

  <path d="M226 536V502" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/>
  <path d="M604 536V502" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/>

  <rect x="326" y="520" width="178" height="72" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="372" y="552" class="body">남은 재고 1</text>
  <text x="356" y="580" class="tiny">결제 후 차감이면 중복 진입 가능</text>

  <rect x="768" y="248" width="736" height="364" rx="28" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="796" y="276" width="168" height="34" rx="17" fill="url(#blue)"/>
  <text x="830" y="299" class="badge">2. 해법: reserve first</text>
  <text x="796" y="344" class="section">먼저 보호하고, 나중에 확정 또는 복구</text>
  <text x="796" y="378" class="small">Stock 내부에서는 상태 전이로 재고를 선점하고, 서비스 간 최종 전파는 Saga로 분리했습니다.</text>

  <rect x="828" y="430" width="146" height="88" rx="22" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="860" y="466" class="body">available</text>
  <text x="854" y="496" class="tiny">아직 누구도 선점 안 함</text>

  <rect x="1080" y="412" width="188" height="124" rx="24" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2.5"/>
  <text x="1148" y="452" class="body">reserved</text>
  <text x="1148" y="482" class="tiny">Try</text>
  <text x="1105" y="506" class="tiny">orderId / expiresAt</text>
  <text x="1114" y="528" class="tiny">idempotencyKey 생성</text>

  <rect x="1342" y="332" width="124" height="88" rx="22" fill="#ECFDF5" stroke="#86EFAC" stroke-width="2.5"/>
  <text x="1380" y="368" class="body">sold</text>
  <text x="1368" y="398" class="tiny">Confirm</text>

  <rect x="1330" y="500" width="150" height="88" rx="22" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="2.5"/>
  <text x="1368" y="536" class="body">available</text>
  <text x="1340" y="566" class="tiny">Cancel / Expire</text>

  <path d="M974 474H1080" stroke="url(#orange)" stroke-width="6" stroke-linecap="round"/>
  <polygon points="1080,474 1064,466 1064,482" fill="#F97316"/>
  <text x="1006" y="456" class="tiny">Try</text>

  <path d="M1268 446H1304V376H1342" stroke="url(#green)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="1342,376 1326,368 1326,384" fill="#16A34A"/>
  <text x="1286" y="358" class="tiny">Confirm</text>

  <path d="M1268 500H1302V544H1330" stroke="url(#red)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="1330,544 1314,536 1314,552" fill="#DC2626"/>
  <text x="1278" y="528" class="tiny">실패 / 취소 / TTL 만료</text>

  <rect x="828" y="554" width="218" height="34" rx="17" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="1.5"/>
  <text x="856" y="576" class="tiny">Stock 내부 정합성 = TCC</text>
  <rect x="1064" y="554" width="250" height="34" rx="17" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="1.5"/>
  <text x="1098" y="576" class="tiny">서비스 간 최종 상태 전파 = Saga</text>

  <rect x="96" y="638" width="1408" height="66" rx="24" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="2"/>
  <text x="130" y="680" class="callout">재고는 결제 후 차감 대상이 아니라, 결제 전에 먼저 reserved로 전환해 보호해야 하는 자원이었습니다.</text>

  <rect x="96" y="728" width="430" height="96" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="126" y="752" width="40" height="40" rx="20" fill="url(#blue)"/>
  <text x="141" y="779" class="badge">1</text>
  <text x="186" y="770" class="cardTitle">오버세일 방지</text>
  <text x="186" y="798" class="cardBody">결제 완료를 기다리지 않고 재고를 먼저 선점</text>

  <rect x="584" y="728" width="430" height="96" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="614" y="752" width="40" height="40" rx="20" fill="url(#green)"/>
  <text x="629" y="779" class="badge">2</text>
  <text x="674" y="770" class="cardTitle">재고 정합성 향상</text>
  <text x="674" y="798" class="cardBody">결제 결과가 재고 상태 전이와 직접 연결</text>

  <rect x="1072" y="728" width="432" height="96" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="1102" y="752" width="40" height="40" rx="20" fill="url(#orange)"/>
  <text x="1117" y="779" class="badge">3</text>
  <text x="1162" y="770" class="cardTitle">복구 가능성 확보</text>
  <text x="1162" y="798" class="cardBody">실패, 취소, 타임아웃, 만료까지 재고 흐름 안에서 처리</text>

  <rect x="96" y="840" width="1408" height="22" rx="11" fill="#FFF7ED"/>
  <text x="126" y="856" class="tiny">Trade-off: 대신 reserved 상태, TTL, 복구 로직을 직접 관리해야 해서 구조는 더 복잡해졌습니다.</text>
</svg>
