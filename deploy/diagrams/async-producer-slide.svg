<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#F7F7FB"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font: 700 46px 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #0F172A; }
      .subtitle { font: 400 20px 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #475569; }
      .section { font: 700 24px 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #0F172A; }
      .body { font: 500 24px 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #1E293B; }
      .small { font: 500 18px 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #475569; }
      .label { font: 700 14px 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; letter-spacing: 0.12em; fill: #2563EB; }
      .note { font: 600 18px 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #7C2D12; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="32" fill="url(#bg)"/>
  <circle cx="1350" cy="130" r="190" fill="#DBEAFE" opacity="0.55"/>
  <circle cx="1480" cy="260" r="96" fill="#E0F2FE" opacity="0.78"/>
  <circle cx="170" cy="760" r="150" fill="#EEF2FF" opacity="0.9"/>

  <rect x="60" y="56" width="1480" height="788" rx="28" fill="#FFFFFF" filter="url(#shadow)"/>

  <text x="110" y="126" class="label">ASYNC PRODUCER</text>
  <text x="110" y="186" class="title">비동기 발행 구조와 안정성 설계</text>
  <text x="110" y="226" class="subtitle">서비스는 publish()만 호출하고, 이벤트 저장과 발행 재시도는 공통 레이어가 맡도록 분리한 구조</text>

  <rect x="100" y="278" width="620" height="360" rx="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  <text x="140" y="332" class="section">핵심 설계 원칙</text>

  <circle cx="148" cy="392" r="16" fill="url(#accent)"/>
  <text x="143" y="399" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">1</text>
  <text x="182" y="400" class="body">서비스는 결제 완료 후 <tspan font-weight="700">publish()</tspan>만 호출합니다.</text>

  <circle cx="148" cy="482" r="16" fill="url(#accent)"/>
  <text x="143" y="489" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">2</text>
  <text x="182" y="490" class="body">이벤트는 먼저 저장한 뒤 커밋 이후에 안전하게 발행을 시도합니다.</text>

  <circle cx="148" cy="572" r="16" fill="url(#accent)"/>
  <text x="143" y="579" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">3</text>
  <text x="182" y="580" class="body">즉시 발행에 실패해도 재시도 레이어가 다시 전송합니다.</text>

  <rect x="770" y="278" width="730" height="360" rx="24" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="2"/>
  <text x="810" y="332" class="section">발행 흐름</text>

  <rect x="812" y="394" width="150" height="72" rx="18" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="2"/>
  <text x="834" y="438" class="body">서비스 로직</text>

  <rect x="1030" y="394" width="160" height="72" rx="18" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="2"/>
  <text x="1060" y="426" class="body">안전 저장</text>
  <text x="1069" y="452" class="small">Outbox</text>

  <rect x="1260" y="394" width="170" height="72" rx="18" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="2"/>
  <text x="1286" y="426" class="body">즉시 발행</text>
  <text x="1298" y="452" class="small">After Commit</text>

  <rect x="1080" y="530" width="170" height="72" rx="18" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="2"/>
  <text x="1106" y="562" class="body">재시도 발행</text>
  <text x="1124" y="588" class="small">Relay</text>

  <rect x="1320" y="530" width="150" height="72" rx="18" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="2"/>
  <text x="1364" y="574" class="body">Kafka</text>

  <path d="M962 430H1030" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/>
  <path d="M1190 430H1260" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/>
  <path d="M1345 466V500H1165V530" stroke="#2563EB" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1250 566H1320" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/>

  <rect x="100" y="684" width="1400" height="140" rx="20" fill="#FFF7ED" stroke="#FED7AA" stroke-width="2"/>
  <text x="134" y="726" class="note">왜 중요한가</text>
  <text x="290" y="718" class="body">비동기 발행에서 가장 위험한 건</text>
  <text x="664" y="718" class="body" font-weight="700">이벤트 유실</text>
  <text x="776" y="718" class="body">이기 때문에, 먼저 저장하고 나중에라도 다시 보낼 수 있어야 합니다.</text>
  <text x="290" y="758" class="body">그래서 서비스가 Kafka 발행 실패를 직접 다루지 않아도, 공통 레이어가 안전하게 재전송할 수 있도록 설계했습니다.</text>
  <text x="134" y="804" class="small">발표 멘트: 서비스는 publish()만 호출하고, 이벤트 저장과 발행 재시도는 outbox와 relay가 맡도록 설계해서 유실 가능성을 낮췄습니다.</text>
</svg>
