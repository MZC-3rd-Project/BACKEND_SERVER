apiVersion: platform.donmoa/v1alpha1
kind: SecretsInventory
metadata:
  name: donmoa-dev-secrets
spec:
  environment: dev
  sourceOfTruth:
    serviceCatalog: deploy/catalog/runtime-services.yaml
    valuesDirectory: deploy/helm/environments/dev
  namingRules:
    commonSecret: donmoa/dev/common
    databaseSecretPattern: donmoa/dev/<service>-db
    keycloakAdminSecret: donmoa/dev/keycloak-admin
    notificationMailSecret: donmoa/dev/notification-mail
    paymentGatewaySecret: donmoa/dev/payment-gateway
    notes:
      - cart uses IRSA for DynamoDB and does not require a dedicated secret by default
      - media-api and media-worker share donmoa/dev/media-db
      - notification uses Gmail SMTP credentials from donmoa/dev/notification-mail
      - payment uses TossPayments credentials from donmoa/dev/payment-gateway
      - business-gateway reuses the shared gateway OIDC client secret until a dedicated seller OIDC client is provisioned
  secrets:
    - remoteRef: donmoa/dev/common
      requiredProperties:
        - APP_SECURITY_CONTEXT_SIGNING_KEY
        - APP_GATEWAY_SECURITY_INTERNAL_AUTH_TOKEN
        - GATEWAY_OAUTH2_CLIENT_SECRET
        - GATEWAY_SESSION_REFRESH_TOKEN_HASH_PEPPER
        - KC_ADMIN_CLIENT_SECRET
      usedBy:
        - keycloak
        - client-gateway
        - business-gateway
        - auth
        - auth
        - product
        - search
        - stock
        - funding
        - sales
        - hot-deal
        - analytics-dashboard
        - order
        - payment
        - review
        - store-query
        - notification
        - chat
        - media-api
        - media-worker
        - cart
    - remoteRef: donmoa/dev/keycloak-db
      requiredProperties:
        - password
      usedBy:
        - keycloak
    - remoteRef: donmoa/dev/keycloak-admin
      requiredProperties:
        - password
      usedBy:
        - keycloak
    - remoteRef: donmoa/dev/auth-db
      requiredProperties:
        - password
      usedBy:
        - auth
    - remoteRef: donmoa/dev/profile-db
      requiredProperties:
        - password
      usedBy:
        - profile
    - remoteRef: donmoa/dev/product-db
      requiredProperties:
        - password
      usedBy:
        - product
    - remoteRef: donmoa/dev/search-db
      requiredProperties:
        - password
      usedBy:
        - search
    - remoteRef: donmoa/dev/search-ai-enrichment
      requiredProperties:
        - queue_url
      usedBy:
        - search
    - remoteRef: donmoa/dev/stock-db
      requiredProperties:
        - password
      usedBy:
        - stock
    - remoteRef: donmoa/dev/funding-db
      requiredProperties:
        - password
      usedBy:
        - funding
    - remoteRef: donmoa/dev/sales-db
      requiredProperties:
        - password
      usedBy:
        - sales
    - remoteRef: donmoa/dev/hotdeal-db
      requiredProperties:
        - password
      usedBy:
        - hot-deal
    - remoteRef: donmoa/dev/order-db
      requiredProperties:
        - password
      usedBy:
        - order
    - remoteRef: donmoa/dev/payment-db
      requiredProperties:
        - password
      usedBy:
        - payment
    - remoteRef: donmoa/dev/payment-gateway
      requiredProperties:
        - TOSSPAYMENTS_CLIENT_KEY
        - TOSSPAYMENTS_SECRET_KEY
      usedBy:
        - payment
    - remoteRef: donmoa/dev/review-db
      requiredProperties:
        - password
      usedBy:
        - review
    - remoteRef: donmoa/dev/store-db
      requiredProperties:
        - password
      usedBy:
        - store
    - remoteRef: donmoa/dev/store-query-db
      requiredProperties:
        - password
      usedBy:
        - store-query
    - remoteRef: donmoa/dev/notification-db
      requiredProperties:
        - password
      usedBy:
        - notification
    - remoteRef: donmoa/dev/notification-mail
      requiredProperties:
        - MAIL_USERNAME
        - MAIL_PASSWORD
        - NOTIFICATION_EMAIL_FROM
      usedBy:
        - notification
    - remoteRef: donmoa/dev/chat-db
      requiredProperties:
        - password
      usedBy:
        - chat
    - remoteRef: donmoa/dev/media-db
      requiredProperties:
        - password
      usedBy:
        - media-api
        - media-worker
    - remoteRef: donmoa/dev/analytics-db
      requiredProperties:
        - password
      usedBy:
        - analytics-dashboard
