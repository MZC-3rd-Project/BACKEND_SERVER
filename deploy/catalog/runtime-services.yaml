apiVersion: platform.donmoa/v1alpha1
kind: RuntimeServiceCatalog
metadata:
  name: donmoa-eks-runtime-services
spec:
  environment: dev
  namespace: donmoa-dev
  defaultChart: spring-service
  exclusions:
    - test-server
  services:
    - key: client-gateway
      runtime:
        type: spring-boot
        applicationName: client-gateway
      build:
        type: gradle
        gradleModule: "servers:gateways:client-gateway"
      image:
        ecrRepository: donmoa-dev-client-gateway
        foundationRepositorySuffix: client-gateway
      deployment:
        namespace: donmoa-dev
        releaseName: client-gateway
        serviceName: client-gateway
        containerPort: 8080
        public: true
        ingressHost: api.dev.<domain>
        rolloutWave: 3
      datastore:
        type: none
        readWriteSplit: false
      externalDependencies:
        - redis
        - keycloak

    - key: edge-nginx
      runtime:
        type: nginx
        applicationName: edge-nginx
      build:
        type: external-image
        sourceImage: nginxinc/nginx-unprivileged:1.27-alpine
      image:
        ecrRepository: donmoa-dev-edge-nginx
        foundationRepositorySuffix: edge-nginx
      deployment:
        namespace: donmoa-dev
        releaseName: edge-nginx
        serviceName: edge-nginx
        containerPort: 8080
        public: true
        ingressHost: edge.dev.example.com
        rolloutWave: 4
      datastore:
        type: none
        readWriteSplit: false
      externalDependencies: []

    - key: keycloak
      runtime:
        type: keycloak
        applicationName: keycloak
      build:
        type: external-image
        sourceImage: quay.io/keycloak/keycloak:24.0.5
      image:
        ecrRepository: donmoa-dev-keycloak
        foundationRepositorySuffix: keycloak
      deployment:
        namespace: donmoa-dev
        releaseName: keycloak
        serviceName: keycloak
        containerPort: 8080
        public: true
        ingressHost: id.dev.<domain>
        rolloutWave: 2
      datastore:
        type: aurora-postgresql
        databaseName: keycloak_db
        readWriteSplit: false
      externalDependencies:
        - aurora-postgresql
        - secrets-manager

    - key: auth
      runtime:
        type: spring-boot
        applicationName: auth-service
      build:
        type: gradle
        gradleModule: "servers:services:auth"
      image:
        ecrRepository: donmoa-dev-auth-service
        foundationRepositorySuffix: auth-service
      deployment:
        namespace: donmoa-dev
        releaseName: auth
        serviceName: auth-service
        containerPort: 8081
        public: false
        rolloutWave: 2
      datastore:
        type: aurora-postgresql
        databaseName: auth_db
        readWriteSplit: false
      externalDependencies:
        - aurora-postgresql
        - kafka

    - key: profile
      runtime:
        type: spring-boot
        applicationName: profile-service
      build:
        type: gradle
        gradleModule: "servers:services:profile"
      image:
        ecrRepository: donmoa-dev-profile-service
        foundationRepositorySuffix: profile-service
      deployment:
        namespace: donmoa-dev
        releaseName: profile
        serviceName: profile-service
        containerPort: 8071
        public: false
        rolloutWave: 2
      datastore:
        type: aurora-postgresql
        databaseName: profile_db
        readWriteSplit: false
      externalDependencies:
        - aurora-postgresql
        - redis
        - kafka

    - key: search
