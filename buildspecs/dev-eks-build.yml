version: 0.2

env:
  shell: bash
  variables:
    GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    SERVICE_CATALOG_PATH: deploy/catalog/runtime-services.yaml
    VALUES_DIRECTORY: deploy/helm/environments/dev
    EKS_DEPLOY_PLAN_PATH: build-output/eks-deploy-plan.json
    BOOT_BUILD_IMAGE_PLATFORM: "linux/amd64"

phases:
  install:
    runtime-versions:
      java: corretto21
    commands:
      - echo "[INFO] install phase started"
      - java -version
      - ruby --version
      - ./gradlew --version

  pre_build:
    commands:
      - set -euo pipefail
      - echo "[INFO] pre_build phase started"
      - AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-ap-northeast-2}"
      - ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
      - IMAGE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION:-latest}"
      - SHORT_TAG="${IMAGE_TAG:0:8}"
      - |
        if [ -z "${SHORT_TAG}" ] || [ "${SHORT_TAG}" = "latest" ]; then
          SHORT_TAG="latest"
        fi
      - mkdir -p build-output
      - export AWS_DEFAULT_REGION ACCOUNT_ID IMAGE_TAG SHORT_TAG SERVICE_CATALOG_PATH VALUES_DIRECTORY EKS_DEPLOY_PLAN_PATH BOOT_BUILD_IMAGE_PLATFORM
      - echo "[INFO] account=${ACCOUNT_ID}, region=${AWS_DEFAULT_REGION}, tag=${SHORT_TAG}"
      - aws ecr get-login-password --region "${AWS_DEFAULT_REGION}" | docker login --username AWS --password-stdin "${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"

  build:
    commands:
      - set -euo pipefail
      - echo "[INFO] build phase started"
      - bash ./scripts/ci/validate-eks-runtime-inputs.sh
      - ruby ./scripts/ci/export-eks-deploy-plan.rb --output "${EKS_DEPLOY_PLAN_PATH}"
      - |
        while IFS=$'\t' read -r service_key gradle_module image_repository image_tag; do
          [ -z "${service_key}" ] && continue

          image_with_tag="${image_repository}:${image_tag}"
          echo "[INFO] Building ${service_key} (${gradle_module}) -> ${image_with_tag}"
          ./gradlew ":${gradle_module}:bootBuildImage" \
            --imageName="${image_with_tag}" \
            --imagePlatform="${BOOT_BUILD_IMAGE_PLATFORM}" \
            --publishImage \
            -x test \
            --no-daemon

          echo "[INFO] Tagging latest for ${image_repository}"
          docker pull "${image_with_tag}"
          docker tag "${image_with_tag}" "${image_repository}:latest"
          docker push "${image_repository}:latest"
        done < <(
          ruby -rjson -e '
            plan = JSON.parse(File.read(ARGV[0]))
            plan.fetch("services", []).each do |service|
              next unless service["buildType"] == "gradle"
              puts [
                service.fetch("key"),
                service.fetch("gradleModule"),
                service.fetch("imageRepository"),
                service.fetch("imageTag")
              ].join("\t")
            end
          ' "${EKS_DEPLOY_PLAN_PATH}"
        )

  post_build:
    commands:
      - set -euo pipefail
      - echo "[INFO] post_build phase started"
      - ruby -rjson -e 'plan = JSON.parse(File.read(ARGV[0])); puts "[INFO] selected services=#{plan.fetch("services", []).map { |service| service.fetch("key") }.join(",")}"' "${EKS_DEPLOY_PLAN_PATH}"

artifacts:
  files:
    - build-output/**/*
    - deploy/**/*
    - scripts/**/*
