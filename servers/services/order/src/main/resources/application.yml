server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: order-service

  # ─── DataSource ───────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/order_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # ─── JPA ──────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 100
    show-sql: false
    open-in-view: false

  # ─── Flyway ─────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration

  # ─── Redis ────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # ─── Kafka ────────────────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: order-service-group
      auto-offset-reset: earliest

# ─── App ─────────────────────────────────────
app:
  tracing:
    sampling-rate: ${APP_TRACING_SAMPLING_RATE:0.1}
  metrics:
    cluster: ${APP_METRICS_CLUSTER:donmoa-dev-eks}
  snowflake:
    datacenter-id: ${SNOWFLAKE_DATACENTER_ID:1}
    worker-id: ${SNOWFLAKE_WORKER_ID:9}

  gateway-security:
    enabled: ${APP_GATEWAY_SECURITY_ENABLED:true}
    gateway-auth-enabled: ${APP_GATEWAY_SECURITY_GATEWAY_AUTH_ENABLED:true}
    internal-auth-header: ${APP_GATEWAY_SECURITY_INTERNAL_AUTH_HEADER:X-Gateway-Auth}
    internal-auth-token: ${APP_GATEWAY_SECURITY_INTERNAL_AUTH_TOKEN:}
    user-id-header: ${APP_GATEWAY_SECURITY_USER_ID_HEADER:X-User-Id}
    required-paths:
      - /api/v1/orders/*/cancel
      - /api/v1/orders/*/refund
    optional-user-context-paths:
      - /api/v1/orders/**

  openapi:
    enabled: true
    title: "Order Service API"
    version: "1.0.0"
    description: |
      주문 서비스 API - 주문 생성, 조회, 상태 관리

# ─── Actuator ─────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_ENDPOINTS:health,info,metrics,prometheus}
  endpoint:
    health:
      show-details: always

# ─── Logging ──────────────────────────────────
logging:
  level:
    com.example: ${LOG_LEVEL:DEBUG}
    org.springframework.kafka: INFO
