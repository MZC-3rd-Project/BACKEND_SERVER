spring:
  datasource:
    url: jdbc:h2:mem:search-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  kafka:
    bootstrap-servers: localhost:9092
  data:
    redis:
      host: localhost
      port: 6379
  elasticsearch:
    uris: http://localhost:9200

search:
  security:
    gateway-auth-enabled: false
  metrics:
    kafka-lag:
      enabled: false

app:
  outbox:
    enabled: false
  openapi:
    enabled: false
