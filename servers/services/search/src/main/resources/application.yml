server:
  port: ${SERVER_PORT:8088}

spring:
  application:
    name: search-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/search_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 100
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: search-service-group
      auto-offset-reset: earliest

app:
  security:
    context:
      signing-key: ${APP_SECURITY_CONTEXT_SIGNING_KEY:}
      max-age-millis: ${APP_SECURITY_CONTEXT_MAX_AGE_MILLIS:300000}

  gateway-security:
    enabled: ${APP_GATEWAY_SECURITY_ENABLED:true}
    gateway-auth-enabled: ${APP_GATEWAY_SECURITY_GATEWAY_AUTH_ENABLED:true}
    internal-auth-header: ${APP_GATEWAY_SECURITY_INTERNAL_AUTH_HEADER:X-Gateway-Auth}
    internal-auth-token: ${APP_GATEWAY_SECURITY_INTERNAL_AUTH_TOKEN:}
    user-id-header: ${APP_GATEWAY_SECURITY_USER_ID_HEADER:X-User-Id}
    optional-user-context-paths:
      - /api/v1/search/**
    excluded-paths:
      - /actuator/**
      - /v3/api-docs/**
      - /swagger-ui/**

  service:
    product-url: ${PRODUCT_SERVICE_URL:http://localhost:8084}
    funding-url: ${FUNDING_SERVICE_URL:http://localhost:8086}
    store-url: ${STORE_SERVICE_URL:http://localhost:8072}
    stock-url: ${STOCK_SERVICE_URL:http://localhost:8085}

  openapi:
    enabled: ${OPENAPI_ENABLED:true}
    title: "Search Service API"
    version: "1.0.0"
    description: |
      상품/굿즈/공연 통합 검색과 색인 소비 서비스

search:
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    index-name: ${SEARCH_INDEX_NAME:items}
  ai-enrichment:
    enabled: ${SEARCH_AI_ENRICHMENT_ENABLED:false}
    queue-url: ${SEARCH_AI_ENRICHMENT_QUEUE_URL:}
    aws-region: ${SEARCH_AI_ENRICHMENT_AWS_REGION:ap-northeast-2}

management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_ENDPOINTS:health,info,metrics,prometheus}
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.example: ${LOG_LEVEL:INFO}
    org.springframework.kafka: INFO
