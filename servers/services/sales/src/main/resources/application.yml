server:
  port: ${SERVER_PORT:8087}

spring:
  application:
    name: sales-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # ─── DataSource ───────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sales_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # ─── JPA ──────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 100
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false

  # ─── Redis ────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # ─── Kafka ────────────────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: sales-service-group
      auto-offset-reset: earliest

# ─── Snowflake ID ────────────────────────────
app:
  security:
    context:
      signing-key: ${APP_SECURITY_CONTEXT_SIGNING_KEY:}
      max-age-millis: ${APP_SECURITY_CONTEXT_MAX_AGE_MILLIS:300000}

  gateway-security:
    enabled: ${APP_GATEWAY_SECURITY_ENABLED:true}
    gateway-auth-enabled: ${APP_GATEWAY_SECURITY_GATEWAY_AUTH_ENABLED:true}
    internal-auth-header: ${APP_GATEWAY_SECURITY_INTERNAL_AUTH_HEADER:X-Gateway-Auth}
    internal-auth-token: ${APP_GATEWAY_SECURITY_INTERNAL_AUTH_TOKEN:}
    user-id-header: ${APP_GATEWAY_SECURITY_USER_ID_HEADER:X-User-Id}
    required-paths:
      - /api/v1/sales/**
    excluded-paths:
      - /actuator/**
      - /v3/api-docs/**
      - /swagger-ui/**

  snowflake:
    datacenter-id: ${SNOWFLAKE_DATACENTER_ID:1}
    worker-id: ${SNOWFLAKE_WORKER_ID:7}

  # ─── Service URLs ────────────────────────────
  service:
    stock-url: ${STOCK_SERVICE_URL:http://localhost:8085}
    product-url: ${PRODUCT_SERVICE_URL:http://localhost:8084}

  stock-cancel-retry:
    processing-stale-threshold-seconds: ${STOCK_CANCEL_RETRY_PROCESSING_STALE_THRESHOLD_SECONDS:120}

  # ─── OpenAPI ──────────────────────────────────
  openapi:
    enabled: ${OPENAPI_ENABLED:true}
    title: "Sales Service API"
    version: "1.0.0"
    description: |
      checkout session orchestration service

# ─── Actuator ─────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_ENDPOINTS:health,info,metrics,prometheus}
  endpoint:
    health:
      show-details: always

# ─── Logging ──────────────────────────────────
logging:
  level:
    com.example: ${LOG_LEVEL:INFO}
    org.springframework.kafka: INFO
