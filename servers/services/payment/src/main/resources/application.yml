server:
  port: ${SERVER_PORT:8095}

spring:
  application:
    name: payment-service

  # ─── DataSource ───────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/payment_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # ─── JPA ──────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 100
    show-sql: false
    open-in-view: false

  # ─── Flyway ─────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration

  # ─── Redis ────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # ─── Kafka ────────────────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: payment-service-group
      auto-offset-reset: earliest

# ─── App ─────────────────────────────────────
app:
  tracing:
    sampling-rate: ${APP_TRACING_SAMPLING_RATE:0.1}
  metrics:
    cluster: ${APP_METRICS_CLUSTER:donmoa-dev-eks}
  snowflake:
    datacenter-id: ${SNOWFLAKE_DATACENTER_ID:1}
    worker-id: ${SNOWFLAKE_WORKER_ID:10}

  gateway-security:
    enabled: ${APP_GATEWAY_SECURITY_ENABLED:false}
    internal-auth-header: X-Gateway-Auth
    internal-auth-token: ${APP_GATEWAY_SECURITY_INTERNAL_AUTH_TOKEN:}
    user-id-header: X-User-Id

  tosspayments:
    secret-key: ${TOSSPAYMENTS_SECRET_KEY:test_sk_placeholder}
    base-url: ${TOSSPAYMENTS_BASE_URL:https://api.tosspayments.com}
    confirm-timeout-seconds: ${TOSSPAYMENTS_CONFIRM_TIMEOUT:30}

  openapi:
    enabled: true
    title: "Payment Service API"
    version: "1.0.0"
    description: |
      결제 서비스 API - TossPayments PG 연동 결제 승인, 조회

# ─── Resilience4j ─────────────────────────────
resilience4j:
  retry:
    instances:
      toss-payments-confirm:
        max-attempts: 3
        wait-duration: 1s
        retry-exceptions:
          - java.net.ConnectException
          - java.net.SocketTimeoutException
          - org.springframework.web.reactive.function.client.WebClientRequestException
        ignore-exceptions:
          - com.example.payment.exception.TossPaymentsApiException
      toss-payments-cancel:
        max-attempts: 3
        wait-duration: 1s
        retry-exceptions:
          - java.net.ConnectException
          - java.net.SocketTimeoutException
          - org.springframework.web.reactive.function.client.WebClientRequestException
        ignore-exceptions:
          - com.example.payment.exception.TossPaymentsApiException
  circuitbreaker:
    instances:
      toss-payments-confirm:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
      toss-payments-cancel:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3

# ─── Actuator ─────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_ENDPOINTS:health,info,metrics,prometheus}
  endpoint:
    health:
      show-details: always

# ─── Logging ──────────────────────────────────
logging:
  level:
    com.example: ${LOG_LEVEL:DEBUG}
    org.springframework.kafka: INFO
