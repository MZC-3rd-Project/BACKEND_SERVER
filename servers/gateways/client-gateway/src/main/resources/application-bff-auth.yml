spring:
  config:
    activate:
      on-profile: bff-auth
  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: ${GATEWAY_OAUTH2_CLIENT_ID:don-moa-gateway}
            client-secret: ${GATEWAY_OAUTH2_CLIENT_SECRET:}
            client-authentication-method: ${GATEWAY_OAUTH2_CLIENT_AUTHENTICATION_METHOD:client_secret_basic}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: ${GATEWAY_OAUTH2_SCOPES:openid,profile,email}
        provider:
          keycloak:
            issuer-uri: ${GATEWAY_OAUTH2_ISSUER_URI:http://keycloak.internal:8080/realms/don-moa}

gateway:
  auth:
    enabled: true
