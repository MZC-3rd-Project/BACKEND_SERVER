server:
  port: ${SERVER_PORT:18080}

spring:
  application:
    name: client-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}
      port: ${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: ${GATEWAY_CORS_ALLOWED_ORIGIN_PATTERNS:*}
                allowedMethods:
                  - "*"
                allowedHeaders: "*"
                allowCredentials: true
          routes:
            - id: store-service
              uri: ${app.service.store-url:http://localhost:8072}
              predicates:
                - Path=/api/store/**
            - id: store-query-service
              uri: ${app.service.store-query-url:http://localhost:8091}
              predicates:
                - Path=/api/v1/store-query/**
            - id: cart-service
              uri: ${app.service.cart-url:http://localhost:8096}
              predicates:
                - Path=/api/v1/cart/**
            - id: media-service
              uri: ${app.service.media-url:http://localhost:8094}
              predicates:
                - Path=/api/v1/media/**
            - id: product-service
              uri: ${app.service.product-url:http://localhost:8084}
              predicates:
                - Path=/api/products/**,/api/goods/**,/api/performances/**,/api/categories/**,/api/items/**
            - id: funding-service
              uri: ${app.service.funding-url:http://localhost:8086}
              predicates:
                - Path=/api/campaigns/**
            - id: sales-service
              uri: ${app.service.sales-url:http://localhost:8087}
              predicates:
                - Path=/api/v1/sales/**
            - id: hot-deal-service
              uri: ${app.service.hot-deal-url:http://localhost:8089}
              predicates:
                - Path=/api/v1/hot-deals/**
            - id: notification-service
              uri: ${app.service.notification-url:http://localhost:8092}
              predicates:
                - Path=/api/v1/notifications/**
            - id: chat-service-api
              uri: ${app.service.chat-url:http://localhost:8093}
              predicates:
                - Path=/api/v1/chat/**
            - id: order-service
              uri: ${app.service.order-url:http://localhost:8090}
              predicates:
                - Path=/api/v1/orders/**
            - id: payment-service
              uri: ${app.service.payment-url:http://localhost:8095}
              predicates:
                - Path=/api/v1/payments/**
            - id: review-service
              uri: ${app.service.review-url:http://localhost:8097}
              predicates:
                - Path=/api/v1/reviews/**
            - id: profile-service
              uri: ${app.service.profile-url:http://localhost:8071}
              predicates:
                - Path=/api/profile/**
            - id: chat-service-ws
              uri: ${app.service.chat-ws-url:ws://localhost:8093}
              predicates:
                - Path=/ws/chat,/ws/chat/**
springdoc:
  swagger-ui:
    disable-swagger-default-url: true
    urls-primary-name: gateway
    urls:
      - name: gateway
        url: /v3/api-docs
      - name: auth
        url: /v3/api-docs-proxy/auth
      - name: profile
        url: /v3/api-docs-proxy/profile
      - name: product
        url: /v3/api-docs-proxy/product
      - name: stock
        url: /v3/api-docs-proxy/stock
      - name: funding
        url: /v3/api-docs-proxy/funding
      - name: sales
        url: /v3/api-docs-proxy/sales
      - name: hot-deal
        url: /v3/api-docs-proxy/hot-deal
      - name: order
        url: /v3/api-docs-proxy/order
      - name: payment
        url: /v3/api-docs-proxy/payment
      - name: store
        url: /v3/api-docs-proxy/store
      - name: store-query
        url: /v3/api-docs-proxy/store-query
      - name: notification
        url: /v3/api-docs-proxy/notification
      - name: chat
        url: /v3/api-docs-proxy/chat
      - name: media-api
        url: /v3/api-docs-proxy/media-api
      - name: analytics-dashboard
        url: /v3/api-docs-proxy/analytics-dashboard
      - name: cart
        url: /v3/api-docs-proxy/cart
      - name: review
        url: /v3/api-docs-proxy/review

gateway:
  oidc:
    issuer-uri: ${GATEWAY_OAUTH2_ISSUER_URI:http://keycloak.internal:8080/realms/don-moa}
    client-id: ${GATEWAY_OAUTH2_CLIENT_ID:don-moa-gateway}
    client-secret: ${GATEWAY_OAUTH2_CLIENT_SECRET:}
    client-authentication-method: ${GATEWAY_OAUTH2_CLIENT_AUTHENTICATION_METHOD:client_secret_basic}
    scopes: ${GATEWAY_OAUTH2_SCOPES:openid,profile,email}
    redirect-uri: ${GATEWAY_OIDC_REDIRECT_URI:http://localhost:18080/login/oauth2/code/keycloak}
    login-success-url: ${GATEWAY_AUTH_LOGIN_SUCCESS_URL:/}
    login-failure-url: ${GATEWAY_AUTH_LOGIN_FAILURE_URL:/auth/login?error=login_failed}
  security:
    internal-auth-header: ${GATEWAY_SECURITY_INTERNAL_AUTH_HEADER:X-Gateway-Auth}
    internal-auth-token: ${GATEWAY_SECURITY_INTERNAL_AUTH_TOKEN:}
    allow-client-identity-headers: ${GATEWAY_SECURITY_ALLOW_CLIENT_IDENTITY_HEADERS:false}
    allow-client-signed-context-header: ${GATEWAY_SECURITY_ALLOW_CLIENT_SIGNED_CONTEXT_HEADER:false}
    relay-path-prefixes: ${GATEWAY_SECURITY_RELAY_PATH_PREFIXES:/bff/v1,/api/v1/auth,/api/profile,/api/v1/users,/api/users,/api/store,/api/v1/store-query,/api/v1/cart,/api/v1/media,/api/v1/chat,/ws/chat,/api/products,/api/goods,/api/performances,/api/items,/api/categories,/api/campaigns,/api/v1/sales,/api/v1/hot-deals,/api/v1/notifications,/api/v1/orders,/api/v1/payments,/api/v1/reviews}
    require-auth-path-prefixes: ${GATEWAY_SECURITY_REQUIRE_AUTH_PATH_PREFIXES:/api/profile,/api/v1/users,/api/users,/api/v1/chat,/ws/chat,/api/v1/cart}
    require-auth-write-path-prefixes: ${GATEWAY_SECURITY_REQUIRE_AUTH_WRITE_PATH_PREFIXES:/bff/v1,/api/profile,/api/v1/users,/api/users,/api/store,/api/v1/cart,/api/v1/media,/api/products,/api/goods,/api/performances,/api/items,/api/categories,/api/campaigns,/api/v1/sales,/api/v1/hot-deals,/api/v1/notifications,/api/v1/orders,/api/v1/payments,/api/v1/reviews}
  session:
    relay-header-enabled: ${GATEWAY_SESSION_RELAY_HEADER_ENABLED:true}
    ops-enabled: ${GATEWAY_SESSION_OPS_ENABLED:false}
    keycloak-logout-enabled: ${GATEWAY_SESSION_KEYCLOAK_LOGOUT_ENABLED:false}
    trusted-header-auth-enabled: ${GATEWAY_SESSION_TRUSTED_HEADER_AUTH_ENABLED:false}
    redis-key-prefix: ${GATEWAY_SESSION_REDIS_KEY_PREFIX:gateway:sess:}
    user-sessions-key-prefix: ${GATEWAY_SESSION_USER_SESSIONS_KEY_PREFIX:gateway:user:sessions:}
    refresh-family-key-prefix: ${GATEWAY_SESSION_REFRESH_FAMILY_KEY_PREFIX:gateway:rtfam:}
    status-field: ${GATEWAY_SESSION_STATUS_FIELD:status}
    active-status: ${GATEWAY_SESSION_ACTIVE_STATUS:ACTIVE}
    revoked-status: ${GATEWAY_SESSION_REVOKED_STATUS:REVOKED}
    refresh-current-hash-field: ${GATEWAY_SESSION_REFRESH_CURRENT_HASH_FIELD:currentRtHash}
    refresh-uid-field: ${GATEWAY_SESSION_REFRESH_UID_FIELD:uid}
    refresh-sid-field: ${GATEWAY_SESSION_REFRESH_SID_FIELD:sid}
    refresh-rotated-at-field: ${GATEWAY_SESSION_REFRESH_ROTATED_AT_FIELD:rotatedAt}
    refresh-reuse-detected-field: ${GATEWAY_SESSION_REFRESH_REUSE_DETECTED_FIELD:reuseDetected}
    refresh-reuse-detected-at-field: ${GATEWAY_SESSION_REFRESH_REUSE_DETECTED_AT_FIELD:reuseDetectedAt}
    refresh-token-hash-pepper: ${GATEWAY_SESSION_REFRESH_TOKEN_HASH_PEPPER:}
    refresh-token-encryption-secret: ${GATEWAY_SESSION_REFRESH_TOKEN_ENCRYPTION_SECRET:${GATEWAY_SESSION_REFRESH_TOKEN_HASH_PEPPER:}}
    session-cookie-name: ${GATEWAY_SESSION_COOKIE_NAME:DONMOA_SESSION}
    session-cookie-path: ${GATEWAY_SESSION_COOKIE_PATH:/}
    keycloak-logout-url: ${GATEWAY_SESSION_KEYCLOAK_LOGOUT_URL:}
    keycloak-logout-auth-header: ${GATEWAY_SESSION_KEYCLOAK_LOGOUT_AUTH_HEADER:${GATEWAY_SECURITY_INTERNAL_AUTH_HEADER:X-Gateway-Auth}}
    keycloak-logout-auth-token: ${GATEWAY_SESSION_KEYCLOAK_LOGOUT_AUTH_TOKEN:${GATEWAY_SECURITY_INTERNAL_AUTH_TOKEN:}}
  deployment:
    fail-fast-enabled: ${GATEWAY_DEPLOYMENT_FAIL_FAST_ENABLED:true}
    enforced-profiles: ${GATEWAY_DEPLOYMENT_ENFORCED_PROFILES:prod,production,stg,stage}
    require-explicit-auth-session-env: ${GATEWAY_DEPLOYMENT_REQUIRE_EXPLICIT_AUTH_SESSION_ENV:true}
    require-auth-or-session-enabled: ${GATEWAY_DEPLOYMENT_REQUIRE_AUTH_OR_SESSION_ENABLED:true}

app:
  tracing:
    sampling-rate: ${APP_TRACING_SAMPLING_RATE:0.1}
  metrics:
    cluster: ${APP_METRICS_CLUSTER:donmoa-dev-eks}
  feature:
    search-enabled: ${APP_FEATURE_SEARCH_ENABLED:true}
  webclient:
    connect-timeout: ${GATEWAY_DOWNSTREAM_CONNECT_TIMEOUT_MS:5000}
    read-timeout: ${GATEWAY_DOWNSTREAM_READ_TIMEOUT_MS:10000}
    write-timeout: ${GATEWAY_DOWNSTREAM_WRITE_TIMEOUT_MS:10000}
    max-in-memory-size: ${GATEWAY_DOWNSTREAM_MAX_IN_MEMORY_BYTES:2097152}
  service:
    analytics-dashboard-url: ${ANALYTICS_DASHBOARD_SERVICE_URL:http://localhost:8095}
  security:
    context:
      signing-key: ${APP_SECURITY_CONTEXT_SIGNING_KEY:}
      max-age-millis: ${APP_SECURITY_CONTEXT_MAX_AGE_MILLIS:300000}
      parser-enabled: ${APP_SECURITY_CONTEXT_PARSER_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_ENDPOINTS:health,info,metrics,prometheus}
  endpoint:
    health:
      show-details: always
