server:
  port: ${SERVER_PORT:18080}

spring:
  application:
    name: client-gateway
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}
      port: ${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: search-service
              uri: ${app.service.search-url:http://localhost:8088}
              predicates:
                - Path=/api/v1/search/**
            - id: media-service
              uri: ${app.service.media-url:http://localhost:8094}
              predicates:
                - Path=/api/v1/media/**
            - id: product-service
              uri: ${app.service.product-url:http://localhost:8084}
              predicates:
                - Path=/api/products/**,/api/goods/**,/api/performances/**,/api/categories/**,/api/items/**
            - id: funding-service
              uri: ${app.service.funding-url:http://localhost:8086}
              predicates:
                - Path=/api/campaigns/**
            - id: sales-service
              uri: ${app.service.sales-url:http://localhost:8087}
              predicates:
                - Path=/api/v1/sales/**
            - id: hot-deal-service
              uri: ${app.service.hot-deal-url:http://localhost:8089}
              predicates:
                - Path=/api/v1/hot-deals/**
            - id: notification-service
              uri: ${app.service.notification-url:http://localhost:8092}
              predicates:
                - Path=/api/v1/notifications/**
            - id: chat-service-api
              uri: ${app.service.chat-url:http://localhost:8093}
              predicates:
                - Path=/api/v1/chat/**
            - id: chat-service-ws
              uri: ${app.service.chat-ws-url:ws://localhost:8093}
              predicates:
                - Path=/ws/chat,/ws/chat/**
gateway:
  auth:
    enabled: ${GATEWAY_AUTH_ENABLED:false}
    auth-service-url: ${app.service.auth-url:http://localhost:8081}
    user-service-url: ${app.service.user-url:http://localhost:8082}
  security:
    internal-auth-header: ${GATEWAY_SECURITY_INTERNAL_AUTH_HEADER:X-Gateway-Auth}
    internal-auth-token: ${GATEWAY_SECURITY_INTERNAL_AUTH_TOKEN:}
    allow-client-identity-headers: ${GATEWAY_SECURITY_ALLOW_CLIENT_IDENTITY_HEADERS:false}
    relay-path-prefixes: ${GATEWAY_SECURITY_RELAY_PATH_PREFIXES:/bff/v1,/api/v1/search,/api/v1/media,/api/v1/chat,/ws/chat,/api/products,/api/goods,/api/performances,/api/items,/api/categories,/api/campaigns,/api/v1/sales,/api/v1/hot-deals,/api/v1/notifications}
    require-auth-path-prefixes: ${GATEWAY_SECURITY_REQUIRE_AUTH_PATH_PREFIXES:/api/v1/chat,/ws/chat}
    require-auth-write-path-prefixes: ${GATEWAY_SECURITY_REQUIRE_AUTH_WRITE_PATH_PREFIXES:/bff/v1,/api/v1/media,/api/products,/api/goods,/api/performances,/api/items,/api/categories,/api/campaigns,/api/v1/sales,/api/v1/hot-deals,/api/v1/notifications}
  session:
    enabled: ${GATEWAY_SESSION_ENABLED:false}
    relay-header-enabled: ${GATEWAY_SESSION_RELAY_HEADER_ENABLED:true}
    ops-enabled: ${GATEWAY_SESSION_OPS_ENABLED:false}
    public-refresh-enabled: ${GATEWAY_SESSION_PUBLIC_REFRESH_ENABLED:false}
    keycloak-logout-enabled: ${GATEWAY_SESSION_KEYCLOAK_LOGOUT_ENABLED:false}
    trusted-header-auth-enabled: ${GATEWAY_SESSION_TRUSTED_HEADER_AUTH_ENABLED:false}
    redis-key-prefix: ${GATEWAY_SESSION_REDIS_KEY_PREFIX:gateway:sess:}
    user-sessions-key-prefix: ${GATEWAY_SESSION_USER_SESSIONS_KEY_PREFIX:gateway:user:sessions:}
    refresh-family-key-prefix: ${GATEWAY_SESSION_REFRESH_FAMILY_KEY_PREFIX:gateway:rtfam:}
    status-field: ${GATEWAY_SESSION_STATUS_FIELD:status}
    active-status: ${GATEWAY_SESSION_ACTIVE_STATUS:ACTIVE}
    revoked-status: ${GATEWAY_SESSION_REVOKED_STATUS:REVOKED}
    refresh-current-hash-field: ${GATEWAY_SESSION_REFRESH_CURRENT_HASH_FIELD:currentRtHash}
    refresh-uid-field: ${GATEWAY_SESSION_REFRESH_UID_FIELD:uid}
    refresh-sid-field: ${GATEWAY_SESSION_REFRESH_SID_FIELD:sid}
    refresh-rotated-at-field: ${GATEWAY_SESSION_REFRESH_ROTATED_AT_FIELD:rotatedAt}
    refresh-reuse-detected-field: ${GATEWAY_SESSION_REFRESH_REUSE_DETECTED_FIELD:reuseDetected}
    refresh-reuse-detected-at-field: ${GATEWAY_SESSION_REFRESH_REUSE_DETECTED_AT_FIELD:reuseDetectedAt}
    refresh-token-hash-pepper: ${GATEWAY_SESSION_REFRESH_TOKEN_HASH_PEPPER:}
    session-cookie-name: ${GATEWAY_SESSION_COOKIE_NAME:SESSION}
    session-cookie-path: ${GATEWAY_SESSION_COOKIE_PATH:/}
    keycloak-logout-url: ${GATEWAY_SESSION_KEYCLOAK_LOGOUT_URL:}
    keycloak-logout-auth-header: ${GATEWAY_SESSION_KEYCLOAK_LOGOUT_AUTH_HEADER:Authorization}
    keycloak-logout-auth-token: ${GATEWAY_SESSION_KEYCLOAK_LOGOUT_AUTH_TOKEN:}

app:
  service:
    analytics-dashboard-url: ${ANALYTICS_DASHBOARD_SERVICE_URL:http://localhost:8095}
  security:
    context:
      signing-key: ${APP_SECURITY_CONTEXT_SIGNING_KEY:}
      max-age-millis: ${APP_SECURITY_CONTEXT_MAX_AGE_MILLIS:300000}
      parser-enabled: ${APP_SECURITY_CONTEXT_PARSER_ENABLED:false}
