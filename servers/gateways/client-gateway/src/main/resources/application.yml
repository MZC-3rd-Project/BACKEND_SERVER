server:
  port: ${SERVER_PORT:18080}

spring:
  application:
    name: client-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}
      port: ${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: ${GATEWAY_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000}
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                  - PATCH
                allowedHeaders: "*"
                allowCredentials: true
          routes:
            - id: store-service
              uri: ${app.service.store-url:http://localhost:8072}
              predicates:
                - Path=/api/store/**
            - id: cart-service
              uri: ${app.service.cart-url:http://localhost:8096}
              predicates:
                - Path=/api/v1/cart/**
            - id: media-service
              uri: ${app.service.media-url:http://localhost:8094}
              predicates:
                - Path=/api/v1/media/**
            - id: product-service
              uri: ${app.service.product-url:http://localhost:8084}
              predicates:
                - Path=/api/products/**,/api/goods/**,/api/performances/**,/api/categories/**,/api/items/**
            - id: funding-service
              uri: ${app.service.funding-url:http://localhost:8086}
              predicates:
                - Path=/api/campaigns/**
            - id: sales-service
              uri: ${app.service.sales-url:http://localhost:8087}
              predicates:
                - Path=/api/v1/sales/**
            - id: hot-deal-service
              uri: ${app.service.hot-deal-url:http://localhost:8089}
              predicates:
                - Path=/api/v1/hot-deals/**
            - id: notification-service
              uri: ${app.service.notification-url:http://localhost:8092}
              predicates:
                - Path=/api/v1/notifications/**
            - id: chat-service-api
              uri: ${app.service.chat-url:http://localhost:8093}
              predicates:
                - Path=/api/v1/chat/**
            - id: order-service
              uri: ${app.service.order-url:http://localhost:8090}
              predicates:
                - Path=/api/v1/orders/**
            - id: chat-service-ws
              uri: ${app.service.chat-ws-url:ws://localhost:8093}
              predicates:
                - Path=/ws/chat,/ws/chat/**
            - id: auth-service-docs
              uri: ${app.service.auth-url:http://localhost:8081}
              predicates:
                - Path=/v3/api-docs/auth
              filters:
                - SetPath=/v3/api-docs
            - id: profile-service-docs
              uri: ${app.service.user-url:http://localhost:8071}
              predicates:
                - Path=/v3/api-docs/profile
              filters:
                - SetPath=/v3/api-docs
            - id: product-service-docs
              uri: ${app.service.product-url:http://localhost:8084}
              predicates:
                - Path=/v3/api-docs/product
              filters:
                - SetPath=/v3/api-docs
            - id: stock-service-docs
              uri: ${app.service.stock-url:http://localhost:8085}
              predicates:
                - Path=/v3/api-docs/stock
              filters:
                - SetPath=/v3/api-docs
            - id: funding-service-docs
              uri: ${app.service.funding-url:http://localhost:8086}
              predicates:
                - Path=/v3/api-docs/funding
              filters:
                - SetPath=/v3/api-docs
            - id: sales-service-docs
              uri: ${app.service.sales-url:http://localhost:8087}
              predicates:
                - Path=/v3/api-docs/sales
              filters:
                - SetPath=/v3/api-docs
            - id: hot-deal-service-docs
              uri: ${app.service.hot-deal-url:http://localhost:8089}
              predicates:
                - Path=/v3/api-docs/hot-deal
              filters:
                - SetPath=/v3/api-docs
            - id: order-service-docs
              uri: ${app.service.order-url:http://localhost:8090}
              predicates:
                - Path=/v3/api-docs/order
              filters:
                - SetPath=/v3/api-docs
            - id: store-service-docs
              uri: ${app.service.store-url:http://localhost:8072}
              predicates:
                - Path=/v3/api-docs/store
              filters:
                - SetPath=/v3/api-docs
            - id: store-query-service-docs
              uri: ${app.service.store-query-url:http://localhost:8091}
              predicates:
                - Path=/v3/api-docs/store-query
              filters:
                - SetPath=/v3/api-docs
            - id: notification-service-docs
              uri: ${app.service.notification-url:http://localhost:8092}
              predicates:
                - Path=/v3/api-docs/notification
              filters:
                - SetPath=/v3/api-docs
            - id: chat-service-docs
              uri: ${app.service.chat-url:http://localhost:8093}
              predicates:
                - Path=/v3/api-docs/chat
              filters:
                - SetPath=/v3/api-docs
            - id: media-api-docs
              uri: ${app.service.media-url:http://localhost:8094}
              predicates:
                - Path=/v3/api-docs/media-api
              filters:
                - SetPath=/v3/api-docs
            - id: analytics-dashboard-docs
              uri: ${app.service.analytics-dashboard-url:http://localhost:8095}
              predicates:
                - Path=/v3/api-docs/analytics-dashboard
              filters:
                - SetPath=/v3/api-docs
            - id: cart-service-docs
              uri: ${app.service.cart-url:http://localhost:8096}
              predicates:
                - Path=/v3/api-docs/cart
              filters:
                - SetPath=/v3/api-docs

springdoc:
  swagger-ui:
    disable-swagger-default-url: true
    urls-primary-name: gateway
    urls:
      - name: gateway
        url: /v3/api-docs
      - name: auth
        url: /v3/api-docs/auth
      - name: profile
        url: /v3/api-docs/profile
      - name: product
        url: /v3/api-docs/product
      - name: stock
        url: /v3/api-docs/stock
      - name: funding
        url: /v3/api-docs/funding
      - name: sales
        url: /v3/api-docs/sales
      - name: hot-deal
        url: /v3/api-docs/hot-deal
      - name: order
        url: /v3/api-docs/order
      - name: store
        url: /v3/api-docs/store
      - name: store-query
        url: /v3/api-docs/store-query
      - name: notification
        url: /v3/api-docs/notification
      - name: chat
        url: /v3/api-docs/chat
      - name: media-api
        url: /v3/api-docs/media-api
      - name: analytics-dashboard
        url: /v3/api-docs/analytics-dashboard
      - name: cart
        url: /v3/api-docs/cart

gateway:
  auth:
    enabled: ${GATEWAY_AUTH_ENABLED:false}
    auth-service-url: ${app.service.auth-url:http://localhost:8081}
    user-service-url: ${app.service.user-url:http://localhost:8082}
  security:
    internal-auth-header: ${GATEWAY_SECURITY_INTERNAL_AUTH_HEADER:X-Gateway-Auth}
    internal-auth-token: ${GATEWAY_SECURITY_INTERNAL_AUTH_TOKEN:}
    allow-client-identity-headers: ${GATEWAY_SECURITY_ALLOW_CLIENT_IDENTITY_HEADERS:false}
    relay-path-prefixes: ${GATEWAY_SECURITY_RELAY_PATH_PREFIXES:/bff/v1,/api/store,/api/v1/cart,/api/v1/media,/api/v1/chat,/ws/chat,/api/products,/api/goods,/api/performances,/api/items,/api/categories,/api/campaigns,/api/v1/sales,/api/v1/hot-deals,/api/v1/notifications,/api/v1/orders}
    require-auth-path-prefixes: ${GATEWAY_SECURITY_REQUIRE_AUTH_PATH_PREFIXES:/api/v1/chat,/ws/chat,/api/v1/cart}
    require-auth-write-path-prefixes: ${GATEWAY_SECURITY_REQUIRE_AUTH_WRITE_PATH_PREFIXES:/bff/v1,/api/store,/api/v1/cart,/api/v1/media,/api/products,/api/goods,/api/performances,/api/items,/api/categories,/api/campaigns,/api/v1/sales,/api/v1/hot-deals,/api/v1/notifications,/api/v1/orders}
  session:
    enabled: ${GATEWAY_SESSION_ENABLED:false}
    relay-header-enabled: ${GATEWAY_SESSION_RELAY_HEADER_ENABLED:true}
    ops-enabled: ${GATEWAY_SESSION_OPS_ENABLED:false}
    public-refresh-enabled: ${GATEWAY_SESSION_PUBLIC_REFRESH_ENABLED:false}
    keycloak-logout-enabled: ${GATEWAY_SESSION_KEYCLOAK_LOGOUT_ENABLED:false}
    trusted-header-auth-enabled: ${GATEWAY_SESSION_TRUSTED_HEADER_AUTH_ENABLED:false}
    redis-key-prefix: ${GATEWAY_SESSION_REDIS_KEY_PREFIX:gateway:sess:}
    user-sessions-key-prefix: ${GATEWAY_SESSION_USER_SESSIONS_KEY_PREFIX:gateway:user:sessions:}
    refresh-family-key-prefix: ${GATEWAY_SESSION_REFRESH_FAMILY_KEY_PREFIX:gateway:rtfam:}
    status-field: ${GATEWAY_SESSION_STATUS_FIELD:status}
    active-status: ${GATEWAY_SESSION_ACTIVE_STATUS:ACTIVE}
    revoked-status: ${GATEWAY_SESSION_REVOKED_STATUS:REVOKED}
    refresh-current-hash-field: ${GATEWAY_SESSION_REFRESH_CURRENT_HASH_FIELD:currentRtHash}
    refresh-uid-field: ${GATEWAY_SESSION_REFRESH_UID_FIELD:uid}
    refresh-sid-field: ${GATEWAY_SESSION_REFRESH_SID_FIELD:sid}
    refresh-rotated-at-field: ${GATEWAY_SESSION_REFRESH_ROTATED_AT_FIELD:rotatedAt}
    refresh-reuse-detected-field: ${GATEWAY_SESSION_REFRESH_REUSE_DETECTED_FIELD:reuseDetected}
    refresh-reuse-detected-at-field: ${GATEWAY_SESSION_REFRESH_REUSE_DETECTED_AT_FIELD:reuseDetectedAt}
    refresh-token-hash-pepper: ${GATEWAY_SESSION_REFRESH_TOKEN_HASH_PEPPER:}
    session-cookie-name: ${GATEWAY_SESSION_COOKIE_NAME:SESSION}
    session-cookie-path: ${GATEWAY_SESSION_COOKIE_PATH:/}
    keycloak-logout-url: ${GATEWAY_SESSION_KEYCLOAK_LOGOUT_URL:}
    keycloak-logout-auth-header: ${GATEWAY_SESSION_KEYCLOAK_LOGOUT_AUTH_HEADER:Authorization}
    keycloak-logout-auth-token: ${GATEWAY_SESSION_KEYCLOAK_LOGOUT_AUTH_TOKEN:}
  deployment:
    fail-fast-enabled: ${GATEWAY_DEPLOYMENT_FAIL_FAST_ENABLED:true}
    enforced-profiles: ${GATEWAY_DEPLOYMENT_ENFORCED_PROFILES:prod,production,stg,stage}
    require-explicit-auth-session-env: ${GATEWAY_DEPLOYMENT_REQUIRE_EXPLICIT_AUTH_SESSION_ENV:true}
    require-auth-or-session-enabled: ${GATEWAY_DEPLOYMENT_REQUIRE_AUTH_OR_SESSION_ENABLED:true}

app:
  feature:
    search-enabled: ${APP_FEATURE_SEARCH_ENABLED:true}
  webclient:
    connect-timeout: ${GATEWAY_DOWNSTREAM_CONNECT_TIMEOUT_MS:5000}
    read-timeout: ${GATEWAY_DOWNSTREAM_READ_TIMEOUT_MS:10000}
    write-timeout: ${GATEWAY_DOWNSTREAM_WRITE_TIMEOUT_MS:10000}
    max-in-memory-size: ${GATEWAY_DOWNSTREAM_MAX_IN_MEMORY_BYTES:2097152}
  service:
    analytics-dashboard-url: ${ANALYTICS_DASHBOARD_SERVICE_URL:http://localhost:8095}
  security:
    context:
      signing-key: ${APP_SECURITY_CONTEXT_SIGNING_KEY:}
      max-age-millis: ${APP_SECURITY_CONTEXT_MAX_AGE_MILLIS:300000}
      parser-enabled: ${APP_SECURITY_CONTEXT_PARSER_ENABLED:false}
