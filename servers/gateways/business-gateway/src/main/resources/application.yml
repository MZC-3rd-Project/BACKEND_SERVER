server:
  port: ${SERVER_PORT:18081}

spring:
  application:
    name: business-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}
      port: ${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: ${GATEWAY_CORS_ALLOWED_ORIGIN_PATTERNS:*}
                allowedMethods:
                  - "*"
                allowedHeaders: "*"
                allowCredentials: true
          routes:
            - id: product-service
              uri: ${app.service.product-url:http://localhost:8084}
              predicates:
                - Path=/api/products/**,/api/goods/**,/api/performances/**,/api/categories/**,/api/items/**,/api/seller/**
            - id: store-service
              uri: ${app.service.store-url:http://localhost:8072}
              predicates:
                - Path=/api/store/**
            - id: store-query-service
              uri: ${app.service.store-query-url:http://localhost:8091}
              predicates:
                - Path=/api/v1/store-query/**
            - id: funding-service
              uri: ${app.service.funding-url:http://localhost:8086}
              predicates:
                - Path=/api/campaigns/**,/api/funding/**
            - id: hot-deal-service
              uri: ${app.service.hot-deal-url:http://localhost:8089}
              predicates:
                - Path=/api/v1/hot-deals/**
            - id: media-service
              uri: ${app.service.media-url:http://localhost:8094}
              predicates:
                - Path=/api/v1/media/**
            - id: order-service
              uri: ${app.service.order-url:http://localhost:8075}
              predicates:
                - Path=/api/v1/orders/**
            - id: order-query-service
              uri: ${app.service.order-query-url:http://localhost:8073}
              predicates:
                - Path=/api/v1/order-query/**
            - id: review-service
              uri: ${app.service.review-url:http://localhost:8097}
              predicates:
                - Path=/api/v1/reviews/**
            - id: profile-service
              uri: ${app.service.profile-url:http://localhost:8071}
              predicates:
                - Path=/api/profile/**
            - id: chat-service
              uri: ${app.service.chat-url:http://localhost:8093}
              predicates:
                - Path=/api/v1/chat/**
            - id: chat-websocket
              uri: ${app.service.chat-ws-url:ws://localhost:8093}
              predicates:
                - Path=/ws/chat,/ws/chat/**

gateway:
  auth:
    enabled: ${GATEWAY_AUTH_ENABLED:true}
    auth-service-url: ${app.service.auth-url:http://localhost:8081}
    user-service-url: ${app.service.user-url:http://localhost:8082}
  oidc:
    issuer-uri: ${GATEWAY_OAUTH2_ISSUER_URI:http://keycloak.internal:8080/realms/don-moa}
    client-id: ${GATEWAY_OAUTH2_CLIENT_ID:don-moa-business-gateway}
    client-secret: ${GATEWAY_OAUTH2_CLIENT_SECRET:}
    client-authentication-method: ${GATEWAY_OAUTH2_CLIENT_AUTHENTICATION_METHOD:client_secret_basic}
    scopes: ${GATEWAY_OAUTH2_SCOPES:openid,profile,email}
    redirect-uri: ${GATEWAY_OIDC_REDIRECT_URI:http://localhost:18081/login/oauth2/code/keycloak}
    login-success-url: ${GATEWAY_AUTH_LOGIN_SUCCESS_URL:/}
    login-failure-url: ${GATEWAY_AUTH_LOGIN_FAILURE_URL:/auth/login?error=login_failed}
  security:
    internal-auth-header: ${GATEWAY_SECURITY_INTERNAL_AUTH_HEADER:X-Gateway-Auth}
    internal-auth-token: ${GATEWAY_SECURITY_INTERNAL_AUTH_TOKEN:}
    allow-client-identity-headers: ${GATEWAY_SECURITY_ALLOW_CLIENT_IDENTITY_HEADERS:false}
    allow-client-signed-context-header: ${GATEWAY_SECURITY_ALLOW_CLIENT_SIGNED_CONTEXT_HEADER:false}
    relay-path-prefixes: ${GATEWAY_SECURITY_RELAY_PATH_PREFIXES:/bff/v1,/api/bff,/api/profile,/api/products,/api/goods,/api/performances,/api/items,/api/categories,/api/seller,/api/store,/api/v1/store-query,/api/campaigns,/api/funding,/api/v1/hot-deals,/api/v1/media,/api/v1/orders,/api/v1/order-query,/api/v1/reviews,/api/v1/chat,/ws/chat}
    require-auth-path-prefixes: ${GATEWAY_SECURITY_REQUIRE_AUTH_PATH_PREFIXES:/bff/v1,/api/profile,/api/products,/api/goods,/api/performances,/api/items,/api/categories,/api/seller,/api/store,/api/v1/store-query,/api/campaigns,/api/funding,/api/v1/hot-deals,/api/v1/media,/api/v1/orders,/api/v1/order-query,/api/v1/reviews,/api/v1/chat,/ws/chat}
    require-auth-write-path-prefixes: ${GATEWAY_SECURITY_REQUIRE_AUTH_WRITE_PATH_PREFIXES:/bff/v1,/api/profile,/api/products,/api/goods,/api/performances,/api/items,/api/categories,/api/seller,/api/store,/api/campaigns,/api/funding,/api/v1/hot-deals,/api/v1/media,/api/v1/orders,/api/v1/reviews}
  session:
    enabled: ${GATEWAY_SESSION_ENABLED:true}
    relay-header-enabled: ${GATEWAY_SESSION_RELAY_HEADER_ENABLED:true}
    redis-key-prefix: ${GATEWAY_SESSION_REDIS_KEY_PREFIX:gateway:sess:}
    auth-state-key-prefix: ${GATEWAY_SESSION_AUTH_STATE_KEY_PREFIX:gateway:auth:state:}
    user-sessions-key-prefix: ${GATEWAY_SESSION_USER_SESSIONS_KEY_PREFIX:gateway:user:sessions:}
    active-status: ${GATEWAY_SESSION_ACTIVE_STATUS:ACTIVE}
    revoked-status: ${GATEWAY_SESSION_REVOKED_STATUS:REVOKED}
    refresh-token-hash-pepper: ${GATEWAY_SESSION_REFRESH_TOKEN_HASH_PEPPER:}
    refresh-token-encryption-secret: ${GATEWAY_SESSION_REFRESH_TOKEN_ENCRYPTION_SECRET:${GATEWAY_SESSION_REFRESH_TOKEN_HASH_PEPPER:}}
    session-cookie-name: ${GATEWAY_SESSION_COOKIE_NAME:DONMOA_SESSION}
    session-cookie-path: ${GATEWAY_SESSION_COOKIE_PATH:/}
    auth-state-ttl-seconds: ${GATEWAY_SESSION_AUTH_STATE_TTL_SECONDS:300}
    cache-enabled: ${GATEWAY_SESSION_CACHE_ENABLED:true}
    cache-maximum-size: ${GATEWAY_SESSION_CACHE_MAXIMUM_SIZE:10000}
    cache-expire-after-write-seconds: ${GATEWAY_SESSION_CACHE_EXPIRE_AFTER_WRITE_SECONDS:5}
  deployment:
    fail-fast-enabled: ${GATEWAY_DEPLOYMENT_FAIL_FAST_ENABLED:true}
    enforced-profiles: ${GATEWAY_DEPLOYMENT_ENFORCED_PROFILES:prod,production,stg,stage}
    require-explicit-auth-session-env: ${GATEWAY_DEPLOYMENT_REQUIRE_EXPLICIT_AUTH_SESSION_ENV:true}
    require-auth-or-session-enabled: ${GATEWAY_DEPLOYMENT_REQUIRE_AUTH_OR_SESSION_ENABLED:true}

app:
  webclient:
    connect-timeout: ${GATEWAY_DOWNSTREAM_CONNECT_TIMEOUT_MS:5000}
    read-timeout: ${GATEWAY_DOWNSTREAM_READ_TIMEOUT_MS:10000}
    write-timeout: ${GATEWAY_DOWNSTREAM_WRITE_TIMEOUT_MS:10000}
  service:
    product-url: ${PRODUCT_SERVICE_URL:http://localhost:8084}
    store-url: ${STORE_SERVICE_URL:http://localhost:8072}
    store-query-url: ${STORE_QUERY_SERVICE_URL:http://localhost:8091}
    funding-url: ${FUNDING_SERVICE_URL:http://localhost:8086}
    hot-deal-url: ${HOT_DEAL_SERVICE_URL:http://localhost:8089}
    media-url: ${MEDIA_SERVICE_URL:http://localhost:8094}
    order-url: ${ORDER_SERVICE_URL:http://localhost:8075}
    order-query-url: ${ORDER_QUERY_SERVICE_URL:http://localhost:8073}
    review-url: ${REVIEW_SERVICE_URL:http://localhost:8097}
    profile-url: ${PROFILE_SERVICE_URL:http://localhost:8071}
    analytics-dashboard-url: ${ANALYTICS_DASHBOARD_SERVICE_URL:http://localhost:8095}
    chat-url: ${CHAT_SERVICE_URL:http://localhost:8093}
    chat-ws-url: ${CHAT_WS_SERVICE_URL:ws://localhost:8093}
    auth-url: ${AUTH_SERVICE_URL:http://localhost:8081}
    user-url: ${USER_SERVICE_URL:http://localhost:8082}
  security:
    context:
      signing-key: ${APP_SECURITY_CONTEXT_SIGNING_KEY:}
      max-age-millis: ${APP_SECURITY_CONTEXT_MAX_AGE_MILLIS:300000}
